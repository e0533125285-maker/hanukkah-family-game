name: Build Windows portable app
on:
  push:
    branches: [windows-portable]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reassemble source archive
        shell: pwsh
        run: |
          $parts = @(Get-ChildItem -Path '.windows-build/source.parts' -Filter 'part-*.b64' | Sort-Object Name)
          if ($parts.Count -ne 18) { throw "Expected 18 archive parts, found $($parts.Count)" }
          $encoded = (($parts | ForEach-Object { [System.IO.File]::ReadAllText($_.FullName).Trim() }) -join '')
          if ($encoded.Length -ne 43780) { throw "Expected 43780 base64 characters, found $($encoded.Length)" }
          $bytes = [Convert]::FromBase64String($encoded)
          [System.IO.File]::WriteAllBytes((Join-Path $PWD 'hanukkiahadiah-source.zip'), $bytes)
          if ((Get-Item 'hanukkiahadiah-source.zip').Length -ne 32835) { throw 'Source archive size mismatch' }
          Expand-Archive -LiteralPath '.\hanukkiahadiah-source.zip' -DestinationPath app
      - name: Build single portable Windows executable
        shell: pwsh
        run: |
          $package = Get-ChildItem -LiteralPath app -Filter 'package.json' -File -Recurse | Select-Object -First 1
          if (-not $package) { throw 'Could not find package.json in extracted source archive.' }
          Set-Location $package.Directory.FullName
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.build=p.build||{};p.build.win=p.build.win||{};delete p.build.win.icon;p.build.win.signAndEditExecutable=false;p.build.win.target=['portable'];fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path 'build/icon.ico') { Remove-Item 'build/icon.ico' -Force }
          npm install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path 'build/icon.ico') { Remove-Item 'build/icon.ico' -Force }
          npx electron-builder --win portable --x64 --config.win.signAndEditExecutable=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem -Path release -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'No Windows EXE was produced.' }
          Write-Host "Portable EXE: $($exe.Name) ($($exe.Length) bytes)"
      - name: Upload portable Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Hanukkiahadiah-Windows-Portable
          path: app/**/release/*.exe
          if-no-files-found: error
          retention-days: 30
