name: Build Windows installer
on:
  push:
    branches: [windows-desktop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reassemble source archive
        shell: pwsh
        run: |
          $parts = @(Get-ChildItem -Path '.windows-build/source.parts' -Filter 'part-*.b64' | Sort-Object Name)
          if ($parts.Count -ne 18) { throw "Expected 18 archive parts, found $($parts.Count)" }
          $encoded = (($parts | ForEach-Object { [System.IO.File]::ReadAllText($_.FullName).Trim() }) -join '')
          if ($encoded.Length -ne 43780) { throw "Expected 43780 base64 characters, found $($encoded.Length)" }
          $bytes = [Convert]::FromBase64String($encoded)
          [System.IO.File]::WriteAllBytes((Join-Path $PWD 'hanukkiahadiah-source.zip'), $bytes)
          if ((Get-Item 'hanukkiahadiah-source.zip').Length -ne 32835) { throw 'Source archive size does not match expected 32835 bytes' }
          Expand-Archive -LiteralPath '.\hanukkiahadiah-source.zip' -DestinationPath app
      - name: Install dependencies
        working-directory: app
        run: npm install
      - name: Build installer and portable EXE
        working-directory: app
        run: npm run dist:win
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Hanukkiahadiah-Windows
          path: app/release/*.exe
          if-no-files-found: error
          retention-days: 30
