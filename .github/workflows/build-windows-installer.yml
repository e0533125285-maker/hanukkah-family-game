name: Build Windows installer
on:
  push:
    branches: [windows-desktop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reassemble source archive
        shell: pwsh
        run: |
          $parts = @(Get-ChildItem -Path '.windows-build/source.parts' -Filter 'part-*.b64' | Sort-Object Name)
          if ($parts.Count -ne 18) { throw "Expected 18 archive parts, found $($parts.Count)" }
          $encoded = (($parts | ForEach-Object { [System.IO.File]::ReadAllText($_.FullName).Trim() }) -join '')
          if ($encoded.Length -ne 43780) { throw "Expected 43780 base64 characters, found $($encoded.Length)" }
          $bytes = [Convert]::FromBase64String($encoded)
          [System.IO.File]::WriteAllBytes((Join-Path $PWD 'hanukkiahadiah-source.zip'), $bytes)
          if ((Get-Item 'hanukkiahadiah-source.zip').Length -ne 32835) { throw 'Source archive size does not match expected 32835 bytes' }
          Expand-Archive -LiteralPath '.\hanukkiahadiah-source.zip' -DestinationPath app
      - name: Locate and build the desktop app
        shell: pwsh
        run: |
          $package = Get-ChildItem -LiteralPath app -Filter 'package.json' -File -Recurse | Select-Object -First 1
          if (-not $package) { throw 'Could not find package.json in the extracted source archive.' }
          $appDir = $package.Directory.FullName
          Write-Host "Building app from $appDir"
          Set-Location $appDir
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(p.build&&p.build.win)delete p.build.win.icon;fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          npm install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win nsis portable --x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'Windows build outputs:'
          Get-ChildItem -Path release -Filter '*.exe' | Select-Object Name, Length
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Hanukkiahadiah-Windows
          path: app/**/release/*.exe
          if-no-files-found: error
          retention-days: 30
